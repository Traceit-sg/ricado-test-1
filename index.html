<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flashing Button</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111;
  }

  button {
    padding: 40px 80px;
    font-size: 2rem;
    font-weight: bold;
    color: #fff;
    background-color: red;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  button.flashing {
    animation: flash 0.3s infinite alternate;
  }

  @keyframes flash {
    from { background-color: red; }
    to   { background-color: blue; }
  }
</style>
</head>
<body>
  <button id="flashButton">Click Me</button>

  <script>
    const button = document.getElementById('flashButton');
    button.addEventListener('click', () => {
      button.classList.toggle('flashing');
    });
  </script>
</body>
</html>
